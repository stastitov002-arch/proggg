name: Build site

on:
  push:
    branches: [main]
    paths:
      - "_projects/**"
      - "_articles/**"
      - "_content/**"
      - "_data/**"
      - "_knowledge/**"
      - "css/**"
      - "js/engineering-base.js"
      - "build.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# Глобальные права (нужны для пуша изменений ботом)
permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    
    # ВАЖНО: Вот эти права нужны для деплоя на GitHub Pages
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pages
        run: python build.py

      - name: Commit generated pages
        run: |
          git config user.name "4060 design bot"
          git config user.email "bot@4060design.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — сборка не нужна"
            exit 0
          fi
          git commit -m "build: regenerate pages [skip ci]"
          git push

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
